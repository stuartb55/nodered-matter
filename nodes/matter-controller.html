<script type="text/javascript">
    RED.nodes.registerType('matter-controller', {
        category: 'config',
        defaults: {
            name: { value: "" }
        },
        label: function() {
            return this.name || "Matter Controller";
        },
        oneditsave: function() {
            // This runs when Add/Update is clicked - log for debugging
            console.log("Matter controller saved with name:", this.name);
        },
        oneditprepare: function() {
            const node = this;
            
            // Check if this is a new node (not yet deployed)
            const isNewNode = !node.id;
            
            // Load devices list
            function loadDevices() {
                if (!node.id) {
                    $('#node-config-devices-list').html('<li><em>Save controller first to view devices</em></li>');
                    return;
                }
                
                $.getJSON(`matter-controller/${node.id}/devices`, function(data) {
                    const devicesList = $('#node-config-devices-list');
                    devicesList.empty();
                    
                    if (data.devices && data.devices.length > 0) {
                        data.devices.forEach(function(device) {
                            const status = device.connected ? 
                                '<span style="color: green;">●</span> Connected' : 
                                '<span style="color: red;">●</span> Disconnected';
                            
                            devicesList.append(
                                `<li>
                                    <strong>${device.name || device.nodeId}</strong><br>
                                    Node ID: ${device.nodeId}<br>
                                    Status: ${status}<br>
                                    ${device.commissioned ? 'Commissioned: ' + new Date(device.commissioned).toLocaleString() : ''}
                                </li>`
                            );
                        });
                    } else {
                        devicesList.append('<li><em>No devices commissioned yet</em></li>');
                    }
                }).fail(function() {
                    $('#node-config-devices-list').html('<li><em>Failed to load devices</em></li>');
                });
            }
            
            // Commission new device
            $('#node-config-commission-button').click(function() {
                // Check if controller has been saved
                if (!node.id) {
                    RED.notify("Please click 'Add' to save the controller first", "warning");
                    $('#node-config-commission-status').html(
                        '<div style="background: #fff3cd; border: 1px solid #ffc107; padding: 10px; border-radius: 3px;">' +
                        '<strong>⚠ Save Required</strong><br>' +
                        'Click "Add" button below to save this controller first.' +
                        '</div>'
                    );
                    return;
                }
                
                // Check if controller is initialized by testing the endpoint
                $('#node-config-commission-status').html('<span style="color: orange;">Checking controller status...</span>');
                
                $.getJSON(`matter-controller/${node.id}/devices`, function() {
                    // Controller is initialized and ready
                    proceedWithCommissioning();
                }).fail(function(xhr) {
                    if (xhr.status === 404) {
                        // Controller not created yet - need to click Add/Update
                        RED.notify("Click 'Add' or 'Update' button first to create the controller", "warning");
                        $('#node-config-commission-status').html(
                            '<div style="background: #fff3cd; border: 1px solid #ffc107; padding: 10px; border-radius: 3px;">' +
                            '<strong>⚠ Controller Not Created</strong><br>' +
                            'Click "Add" or "Update" button below to create the controller.' +
                            '</div>'
                        );
                    } else {
                        // Controller exists but may still be initializing
                        RED.notify("Controller is still initializing, please wait...", "warning");
                        $('#node-config-commission-status').html(
                            '<div style="background: #d1ecf1; border: 1px solid #0c5460; padding: 10px; border-radius: 3px; color: #0c5460;">' +
                            '<strong>⏳ Controller Initializing</strong><br>' +
                            'The Matter controller is starting up (this can take 10-20 seconds).<br>' +
                            'Please wait a moment and try again.' +
                            '</div>'
                        );
                    }
                });
            });
            
            function proceedWithCommissioning() {
                const pairingCode = $('#node-config-pairing-code').val().trim();
                const deviceName = $('#node-config-device-name').val().trim();
                
                if (!pairingCode) {
                    RED.notify("Please enter a pairing code", "error");
                    return;
                }
                
                $('#node-config-commission-status').html('<span style="color: orange;">Commissioning device...</span>');
                
                $.ajax({
                    url: `matter-controller/${node.id}/commission`,
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        pairingCode: pairingCode,
                        deviceName: deviceName
                    }),
                    success: function(result) {
                        $('#node-config-commission-status').html(
                            `<span style="color: green;">✓ ${result.message} (Node ID: ${result.nodeId})</span>`
                        );
                        $('#node-config-pairing-code').val('');
                        $('#node-config-device-name').val('');
                        
                        // Reload devices list
                        setTimeout(loadDevices, 1000);
                    },
                    error: function(xhr) {
                        const error = xhr.responseJSON ? xhr.responseJSON.error : 'Unknown error';
                        $('#node-config-commission-status').html(
                            `<span style="color: red;">✗ ${error}</span>`
                        );
                    }
                });
            }
            
            // Show warning if this is a new node
            if (isNewNode) {
                $('#node-config-commission-status').html(
                    '<div style="background: #d1ecf1; border: 1px solid #0c5460; padding: 15px; border-radius: 3px; color: #0c5460;">' +
                    '<strong>ℹ️ First Time Setup - READ THIS</strong><br><br>' +
                    '<strong>Step 1:</strong> Enter a name above (e.g., "Home Matter")<br>' +
                    '<strong>Step 2:</strong> Click "Add" button below<br>' +
                    '<strong>Step 3:</strong> Wait 10-15 seconds<br>' +
                    '<strong>Step 4:</strong> REOPEN this dialog<br>' +
                    '<strong>Step 5:</strong> Enter pairing code and commission<br><br>' +
                    '⚠️ You CANNOT commission in this dialog session.<br>' +
                    'You must click "Add" first, then reopen!' +
                    '</div>'
                );
                $('#node-config-devices-list').html('<li><em>Click Add first, then reopen this dialog</em></li>');
                
                // Disable commissioning fields for new nodes
                $('#node-config-pairing-code').prop('disabled', true).val('').attr('placeholder', 'Save controller first by clicking Add below');
                $('#node-config-device-name').prop('disabled', true).val('').attr('placeholder', 'Not available yet');
                $('#node-config-commission-button').prop('disabled', true);
            } else {
                // Check if controller is initialized
                $.getJSON(`matter-controller/${node.id}/devices`, function() {
                    // Controller is ready
                    loadDevices();
                    $('#node-config-commission-status').html(
                        '<div style="background: #d4edda; border: 1px solid #28a745; padding: 10px; border-radius: 3px; color: #155724;">' +
                        '<strong>✓ Controller Ready</strong><br>' +
                        'You can now commission devices using the form below.' +
                        '</div>'
                    );
                    // Enable commissioning fields
                    $('#node-config-pairing-code').prop('disabled', false);
                    $('#node-config-device-name').prop('disabled', false);
                    $('#node-config-commission-button').prop('disabled', false);
                }).fail(function(xhr) {
                    // Disable commissioning until ready
                    $('#node-config-pairing-code').prop('disabled', true).val('').attr('placeholder', 'Controller not ready yet');
                    $('#node-config-device-name').prop('disabled', true).val('');
                    $('#node-config-commission-button').prop('disabled', true);
                    
                    if (xhr.status === 404) {
                        // Controller not created (user edited but didn't click Update)
                        $('#node-config-commission-status').html(
                            '<div style="background: #fff3cd; border: 1px solid #ffc107; padding: 15px; border-radius: 3px;">' +
                            '<strong>⚠️ Controller Not Created Yet</strong><br><br>' +
                            'You made changes but haven\'t saved them.<br><br>' +
                            '<strong>To commission devices:</strong><br>' +
                            '1. Click "Update" button below<br>' +
                            '2. Wait 10-15 seconds<br>' +
                            '3. Close this dialog<br>' +
                            '4. Reopen to commission devices' +
                            '</div>'
                        );
                    } else {
                        // Controller initializing
                        $('#node-config-commission-status').html(
                            '<div style="background: #d1ecf1; border: 1px solid #0c5460; padding: 15px; border-radius: 3px; color: #0c5460;">' +
                            '<strong>⏳ Controller Still Initializing...</strong><br><br>' +
                            'The Matter controller is starting up (takes 10-20 seconds).<br><br>' +
                            '<strong>What to do:</strong><br>' +
                            '1. Close this dialog<br>' +
                            '2. Wait 10 more seconds<br>' +
                            '3. Reopen and try again' +
                            '</div>'
                        );
                    }
                    $('#node-config-devices-list').html('<li><em>Waiting for controller...</em></li>');
                });
            }
        }
    });
</script>

<script type="text/html" data-template-name="matter-controller">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="Matter Controller">
    </div>
    
    <div class="form-row">
        <label style="width: 100%; border-bottom: 1px solid #ccc; padding-bottom: 5px;">
            <strong>Commission New Device</strong>
        </label>
    </div>
    
    <div class="form-row">
        <label for="node-config-pairing-code"><i class="fa fa-key"></i> Pairing Code</label>
        <input type="text" id="node-config-pairing-code" placeholder="Enter Matter pairing code">
        <div style="margin-top: 5px; font-size: 0.9em; color: #666;">
            Enter the Matter pairing code from your device (e.g., from QR code or manual code)
        </div>
    </div>
    
    <div class="form-row">
        <label for="node-config-device-name"><i class="fa fa-tag"></i> Device Name</label>
        <input type="text" id="node-config-device-name" placeholder="Optional device name">
    </div>
    
    <div class="form-row">
        <label></label>
        <button type="button" id="node-config-commission-button" class="red-ui-button" onclick="return false;">
            <i class="fa fa-plus"></i> Commission Device
        </button>
    </div>
    
    <div class="form-row">
        <div id="node-config-commission-status" style="padding: 10px;"></div>
    </div>
    
    <div class="form-row">
        <label style="width: 100%; border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-top: 20px;">
            <strong>Commissioned Devices</strong>
        </label>
    </div>
    
    <div class="form-row">
        <ul id="node-config-devices-list" style="list-style: none; padding: 10px; background: #f9f9f9; border-radius: 3px;">
            <li><em>Loading devices...</em></li>
        </ul>
    </div>
</script>

<script type="text/html" data-help-name="matter-controller">
    <p>Configuration node for Matter smart home controller.</p>
    
    <h3>About</h3>
    <p>This node manages the Matter controller and handles device commissioning. 
    Use it to add Matter devices to your Node-RED flow.</p>
    
    <h3>First Time Setup</h3>
    <ol>
        <li>Create a new Matter Controller configuration</li>
        <li>Give it a name</li>
        <li><strong>Click "Add" to save the controller</strong></li>
        <li>Deploy your flow (if prompted)</li>
        <li>Reopen the controller configuration to commission devices</li>
    </ol>
    
    <h3>Commissioning Devices</h3>
    <ol>
        <li>Put your Matter device in pairing mode</li>
        <li>Enter the pairing code (from QR code or device manual)</li>
        <li>Optionally give the device a friendly name</li>
        <li>Click "Commission Device"</li>
        <li>Wait 30-60 seconds for commissioning to complete</li>
    </ol>
    
    <h3>Details</h3>
    <p>Once commissioned, devices will automatically reconnect when Node-RED starts. 
    Device data is stored in the Node-RED user directory under <code>.node-red-matter</code>.</p>
    
    <p><strong>Note:</strong> You must save the controller configuration before you can commission devices.</p>
</script>
